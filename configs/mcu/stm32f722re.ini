; DMCLK configuration for STM32F722RE microcontroller
; Maximum frequency: 216 MHz
; Typical external oscillator: 8 MHz or 25 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=216000000
tolerance=1000
oscillator_frequency=8000000
