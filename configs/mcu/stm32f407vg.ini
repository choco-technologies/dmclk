; DMCLK configuration for STM32F407VG microcontroller
; Maximum frequency: 168 MHz
; Typical external oscillator: 8 MHz or 25 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=168000000
tolerance=1000
oscillator_frequency=8000000
