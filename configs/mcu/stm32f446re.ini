; DMCLK configuration for STM32F446RE microcontroller
; Maximum frequency: 180 MHz
; Typical external oscillator: 8 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=180000000
tolerance=1000
oscillator_frequency=8000000
