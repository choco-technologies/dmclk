; DMCLK configuration for the ESP32-S3 microcontroller
; Maximum CPU frequency: 240 MHz (80 and 160 MHz are possible as well)
; The crystal is 40 MHz (the only one that the chip takes). The PLL is started by the port.
; Configure clocks before every other driver.
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=240000000
tolerance=1000
oscillator_frequency=40000000
