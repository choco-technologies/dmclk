; DMCLK configuration for STM32F411RE microcontroller
; Maximum frequency: 100 MHz
; Typical external oscillator: 8 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=100000000
tolerance=1000
oscillator_frequency=8000000
