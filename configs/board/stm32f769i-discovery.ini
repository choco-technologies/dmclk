; DMCLK configuration for STM32F769I-DISCOVERY board
; Board: STM32F769I-DISCOVERY (MB1225)
; MCU: STM32F769NIH6
; External oscillator: 25 MHz (HSE)
; Maximum frequency: 216 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=216000000
tolerance=1000
oscillator_frequency=25000000
