; DMCLK configuration for STM32F4DISCOVERY board (STM32F407VG)
; Board: STM32F4DISCOVERY (MB997)
; MCU: STM32F407VGT6
; External oscillator: 8 MHz (HSE)
; Maximum frequency: 168 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=168000000
tolerance=1000
oscillator_frequency=8000000
