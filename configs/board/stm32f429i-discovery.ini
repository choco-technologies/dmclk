; DMCLK configuration for STM32F429I-DISCOVERY board
; Board: STM32F429I-DISCOVERY (MB1075)
; MCU: STM32F429ZIT6
; External oscillator: 8 MHz (HSE)
; Maximum frequency: 180 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=180000000
tolerance=1000
oscillator_frequency=8000000
