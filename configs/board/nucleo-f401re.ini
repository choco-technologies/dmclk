; DMCLK configuration for NUCLEO-F401RE board
; Board: NUCLEO-F401RE
; MCU: STM32F401RET6
; External oscillator: 8 MHz (HSE from ST-LINK)
; Maximum frequency: 84 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=84000000
tolerance=1000
oscillator_frequency=8000000
