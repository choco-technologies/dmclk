; DMCLK configuration for the ESP32-S3 2.8" display board (ESP32-S3FN16R8)
; External crystal: 40 MHz
; Maximum CPU frequency: 240 MHz
; Configure clocks before every other driver.
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=240000000
tolerance=1000
oscillator_frequency=40000000
