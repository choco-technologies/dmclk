; DMCLK configuration for NUCLEO-F411RE board
; Board: NUCLEO-F411RE
; MCU: STM32F411RET6
; External oscillator: 8 MHz (HSE from ST-LINK)
; Maximum frequency: 100 MHz
; Configure clocks before every other driver (GPIO, FMC/SDRAM, ...).
[main]
driver_order=-10

[dmclk]
source=external
target_frequency=100000000
tolerance=1000
oscillator_frequency=8000000
